name: timer

# 工作日每天跑一次：快照 → 存档到全收录 → 清空日更歌单 → 重排精选 → 出文章/统计 → 发布 gh-pages
# 跑完用 Bark 推一条通知到手机（成功发摘要，失败发错误）。
#
# 凭证（environment: job 的三个 secret，均为 base64 编码的原始文件）：
#   NCM_DEVICE       ~/.netease_mcp_device.json
#   NCM_CREDENTIALS  ~/.config/ncm-cli/credentials.enc.json
#   NCM_TOKENS       ~/.config/ncm-cli/tokens.enc.json
# 三者必须成套：加密密钥由 deviceId 派生（sha-256），缺 device 文件就解不开。
#
# accessToken 只有 24 小时，automator 会用 refreshToken 自行续期（ncm-cli 自带的续期有 bug，
# 见 lib/auth.mjs）。续期后的 tokens.enc.json 通过 Actions cache 传递到下一次运行。
#
# 通知（environment: job 的 secret，缺了只跳过通知、不影响跑批）：
#   BARK_URL_ALWAYS      不管成败都推（这台收全部，包括失败）
#   BARK_URL_ON_SUCCESS  只在跑成功时推（这台只收好消息）
# 一个变量里塞多条用逗号或换行分隔，加设备不用改代码。

on:
  schedule:
    # 周一到周五（GitHub 的 cron 不收时区，也不认"工作日"，只能写成 1-5）。
    #
    # 为什么是 UTC 05:00 而不是 13:00：这个仓库的 schedule 长期晚 5.8–11.6 小时
    # （2026-11 的 15 次运行全部落在 18:20–22:33 UTC，均值约 8 小时）。
    # 05:00 UTC = 北京 13:00，加 8 小时延迟 ≈ 北京 21:00，正是想要的落点。
    # 代价：延迟有方差，实际落在 18:50–00:40；哪天 GitHub 恢复准点就会在中午跑，
    # 把当天没加完的歌截断成半成品（那时把这里改回 13:00）。
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只演练，不写入线上"
        type: boolean
        default: false
      force_refresh:
        description: "强制用 refreshToken 续期（忽略 cache 里的 token）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: timer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: job
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: dada
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install ncm-cli
        run: |
          npm i -g @music163/ncm-cli@0.1.7
          ncm-cli --version
          command -v montage >/dev/null || echo "::warning::montage 缺失，封面拼图会被跳过"

      - name: check secrets
        env:
          NCM_DEVICE: ${{ secrets.NCM_DEVICE }}
          NCM_CREDENTIALS: ${{ secrets.NCM_CREDENTIALS }}
          NCM_TOKENS: ${{ secrets.NCM_TOKENS }}
          BARK_URL_ALWAYS: ${{ secrets.BARK_URL_ALWAYS }}
          BARK_URL_ON_SUCCESS: ${{ secrets.BARK_URL_ON_SUCCESS }}
        run: |
          missing=0
          for v in NCM_DEVICE NCM_CREDENTIALS NCM_TOKENS; do
            if [ -z "${!v}" ]; then echo "::error::缺少 secret $v"; missing=1; fi
          done
          # 通知是锦上添花，缺了就跳过，不让跑批失败
          [ -n "$BARK_URL_ALWAYS" ] ||
            echo "::warning::没有 BARK_URL_ALWAYS，失败时不会有任何通知"
          [ -n "$BARK_URL_ON_SUCCESS" ] ||
            echo "::warning::没有 BARK_URL_ON_SUCCESS，成功时只推 ALWAYS 那台"
          exit $missing

      - name: restore credentials
        env:
          NCM_DEVICE: ${{ secrets.NCM_DEVICE }}
          NCM_CREDENTIALS: ${{ secrets.NCM_CREDENTIALS }}
          NCM_TOKENS: ${{ secrets.NCM_TOKENS }}
        run: |
          mkdir -p ~/.config/ncm-cli
          printf '%s' "$NCM_DEVICE" |
            base64 -d > ~/.netease_mcp_device.json
          printf '%s' "$NCM_CREDENTIALS" |
            base64 -d > ~/.config/ncm-cli/credentials.enc.json
          printf '%s' "$NCM_TOKENS" |
            base64 -d > ~/.config/ncm-cli/tokens.enc.json
          chmod 600 ~/.netease_mcp_device.json ~/.config/ncm-cli/*.json

      # 上一次运行续期后的 token（cache 不可变，所以 key 用 run_id，靠 restore-keys 取最新）
      - name: restore refreshed tokens
        if: ${{ inputs.force_refresh != true }}
        uses: actions/cache/restore@v4
        with:
          path: ~/.config/ncm-cli/tokens.enc.json
          key: ncm-tokens-${{ github.run_id }}
          restore-keys: |
            ncm-tokens-

      - name: checkout gh-pages work copy
        run: |
          git clone --single-branch --branch gh-pages \
            "https://github.com/${{ github.repository }}.git" playlists

      - name: automator
        env:
          RUN_SUMMARY: /tmp/automator-run.json
        run: |
          flags=""
          [ "${{ inputs.force_refresh }}" != "true" ] ||
            flags="$flags --force-refresh"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node automator.mjs $flags
          else
            node automator.mjs --apply $flags
          fi

      - name: save refreshed tokens
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.config/ncm-cli/tokens.enc.json
          key: ncm-tokens-${{ github.run_id }}

      - name: deploy
        if: ${{ inputs.dry_run != true }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playlists
          disable_nojekyll: true

      # 通知放在最后：等站点部署完再推，点开链接就是新页面。
      # if: always() —— 跑挂了更要通知（那时候摘要里带着 error 和出错的步骤）。
      - name: notify (bark)
        if: always()
        env:
          BARK_URL_ALWAYS: ${{ secrets.BARK_URL_ALWAYS }}
          BARK_URL_ON_SUCCESS: ${{ secrets.BARK_URL_ON_SUCCESS }}
          RUN_STATUS: ${{ job.status }}
        run: |
          # 失败通知点开直接看这次运行的日志（这三个是 runner 自带的默认变量）
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          export RUN_URL="$RUN_URL/actions/runs/$GITHUB_RUN_ID"
          node lib/bark.mjs --summary /tmp/automator-run.json
